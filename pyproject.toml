[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonrec"
version = "0.1.0"
description = "Phoneme recognition (CTC) — Colab training, live USB-mic testing"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end smoke run (needs torch)"]
